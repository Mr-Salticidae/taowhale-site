services:
  web:
    build: .
    container_name: whalesea
    ports:
      - "80:8000"
    volumes:
      - ./data:/app/data
    environment:
      # 重要:上线前改成你自己的随机长字符串(如 openssl rand -hex 32 生成)
      - JWT_SECRET=CHANGE_ME_TO_RANDOM_64_CHARS
      # 官方账号(admin@taowhale.local)登录密码;设置后每次启动会重置为该值
      - ADMIN_PASSWORD=CHANGE_ME_TO_ADMIN_PASSWORD
    restart: unless-stopped
