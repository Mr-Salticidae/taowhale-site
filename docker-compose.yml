services:
  web:
    build: .
    container_name: whalesea
    ports:
      - "80:8000"
    volumes:
      - ./data:/app/data
    environment:
      # 密钥从同目录 .env 注入(.env 已 gitignore,不入库);未设置则启动直接报错,
      # 杜绝用占位符/弱默认上线。模板见 .env.example:cp .env.example .env 后填值。
      # 生成强密钥:openssl rand -hex 32
      - JWT_SECRET=${JWT_SECRET:?请在 .env 设置 JWT_SECRET(openssl rand -hex 32)}
      # 官方账号(admin@taowhale.local)登录密码;设置后每次启动会重置为该值
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?请在 .env 设置 ADMIN_PASSWORD}
    restart: unless-stopped
