    api('/api/admin/groups').then(d => setGroups(d.groups)).catch(e => setErr(e.message));
    api('/api/admin/users').then(d => setUsers(d.users)).catch(() => {});
  };
  useEffect(load, []);

  const createGroup = async () => {
    if (!newName.trim()) { setErr('组名不能为空'); return; }
    setErr('');
    try { await api('/api/admin/groups', { method: 'POST', body: { name: newName.trim() } }); setNewName(''); load(); }
    catch (e) { setErr(e.message); }
  };
  const delGroup = async g => {
    if (!window.confirm('删除组「' + g.name + '」?(组内有文档时无法删除)')) return;
    setErr('');
    try { await api('/api/admin/groups/' + g.id, { method: 'DELETE' }); load(); }
    catch (e) { setErr(e.message); }
  };
  const addMember = async g => {
    const uid = parseInt(addSel[g.id], 10);
    if (!uid) { setErr('请先选择要加入的成员'); return; }
    setErr('');
    try { await api('/api/admin/groups/' + g.id + '/members', { method: 'POST', body: { user_id: uid } }); load(); }
    catch (e) { setErr(e.message); }
  };
  const removeMember = async (g, u) => {
    if (!window.confirm('将 ' + u.name + ' 移出「' + g.name + '」?')) return;
    setErr('');
    try { await api('/api/admin/groups/' + g.id + '/members/' + u.id, { method: 'DELETE' }); load(); }
    catch (e) { setErr(e.message); }
  };

  return (
    <div>
      {err && <div className="demo-banner" style={{ borderColor: '#d05858', color: '#d05858' }}>ERROR · {err}</div>}
      <div className="composer" style={{ display: 'flex', gap: 10, alignItems: 'center', padding: 16 }}>
        <div className="field" style={{ flex: 1, marginBottom: 0 }}>
          <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="新工作组名称,如 运营组" maxLength={30}
            onKeyDown={e => { if (e.key === 'Enter') createGroup(); }} />
        </div>
        <button className="btn btn-primary" style={{ padding: '9px 22px', fontSize: 13 }} onClick={createGroup}>+ 创建组</button>
      </div>
      {groups === null ? <div className="demo-banner">LOADING · 正在加载工作组…</div> : groups.map(g => (
        <div className="admin-wrap" key={g.id} style={{ marginBottom: 18 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px 0 6px' }}>
            <h3 style={{ fontSize: 16 }}>{g.name} <span className="mono" style={{ fontSize: 12, color: 'var(--faint)' }}>· {g.members.length} 成员 · {g.doc_count} 文档</span></h3>
            <button className="admin-act danger" onClick={() => delGroup(g)}>删除组</button>
          </div>
          <table className="admin-table">
            <tbody>
              {g.members.map(u => (
                <tr key={u.id}>
                  <td className="mono">{u.id}</td>
                  <td>{u.name}</td>
                  <td className="mono">{u.email}</td>
                  <td><span className={'role-pill ' + (u.role === 'student' ? 'student' : '')}>{roleLabel(u.role)}</span></td>
                  <td style={{ textAlign: 'right' }}><button className="admin-act danger" onClick={() => removeMember(g, u)}>移出</button></td>
                </tr>
              ))}
              {g.members.length === 0 && <tr><td className="mono" colSpan="5">暂无成员</td></tr>}
              <tr>
                <td colSpan="5">
                  <select value={addSel[g.id] || ''} onChange={e => setAddSel(s => ({ ...s, [g.id]: e.target.value }))}>
                    <option value="">选择要加入的成员…</option>
                    {users.filter(u => !u.banned && !g.members.some(m => m.id === u.id)).map(u => (
                      <option key={u.id} value={u.id}>{u.name}({u.email})</option>
                    ))}
                  </select>
                  <button className="admin-act" style={{ marginLeft: 8 }} onClick={() => addMember(g)}>加入该组</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      ))}
    </div>
  );
}

/* ---------- 管理后台:知识库分类管理(两层 kb_cats) ---------- */
function CatsAdmin() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  const [topName, setTopName] = useState('');
  const [subName, setSubName] = useState({});

  const load = () => api('/api/kb/cats').then(setData).catch(e => setErr(e.message));
  useEffect(load, []);

  const create = async (name, parent_id) => {
    if (!name.trim()) { setErr('分类名不能为空'); return; }
    setErr('');
    try { await api('/api/admin/kb/cats', { method: 'POST', body: { name: name.trim(), parent_id: parent_id || 0 } }); load(); }
    catch (e) { setErr(e.message); }
  };
  const rename = async c => {
    const name = window.prompt('重命名分类', c.name);
    if (name === null || !name.trim() || name.trim() === c.name) return;
    setErr('');
    try { await api('/api/admin/kb/cats/' + c.id, { method: 'PUT', body: { name: name.trim(), parent_id: c.parent_id || 0, sort: c.sort || 0 } }); load(); }
    catch (e) { setErr(e.message); }
  };
  const setSort = async (c, sort) => {
    setErr('');
    try { await api('/api/admin/kb/cats/' + c.id, { method: 'PUT', body: { name: c.name, parent_id: c.parent_id || 0, sort: parseInt(sort, 10) || 0 } }); load(); }
    catch (e) { setErr(e.message); }
  };
  const del = async c => {
    if (!window.confirm('删除分类「' + c.name + '」?(其下有文档或子分类时无法删除)')) return;
    setErr('');
    try { await api('/api/admin/kb/cats/' + c.id, { method: 'DELETE' }); load(); }
    catch (e) { setErr(e.message); }
  };

  return (
    <div>
      {err && <div className="demo-banner" style={{ borderColor: '#d05858', color: '#d05858' }}>ERROR · {err}</div>}
      <p className="rb-hint" style={{ margin: '0 0 12px' }}>两层分类树:顶层分类下可建子分类。导入个人库时会按文件夹路径自动生成,这里可手动增删改、调整排序(数字大的在前,回车保存)。</p>
      <div className="composer" style={{ display: 'flex', gap: 10, alignItems: 'center', padding: 16 }}>
        <div className="field" style={{ flex: 1, marginBottom: 0 }}>
          <input value={topName} onChange={e => setTopName(e.target.value)} placeholder="新顶层分类,如 AI绘画" maxLength={60}
            onKeyDown={e => { if (e.key === 'Enter') { create(topName, 0); setTopName(''); } }} />
        </div>
        <button className="btn btn-primary" style={{ padding: '9px 22px', fontSize: 13 }} onClick={() => { create(topName, 0); setTopName(''); }}>+ 顶层分类</button>
      </div>
      {data === null ? <div className="demo-banner">LOADING · 正在加载分类…</div> : (data.cats || []).length === 0 ? (
        <div className="demo-banner">还没有分类。在上方新建,或用 import_local_kb.py 导入个人库自动生成。</div>
      ) : data.cats.map(c => (
        <div className="admin-wrap" key={c.id} style={{ marginBottom: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 0 6px', gap: 10, flexWrap: 'wrap' }}>
            <h3 style={{ fontSize: 15.5 }}>{c.name} <span className="mono" style={{ fontSize: 12, color: 'var(--faint)' }}>· {c.count} 文档 · {(c.children || []).length} 子类</span></h3>
            <span style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
              <input className="cat-sort" defaultValue={c.sort} title="排序(大在前,回车保存)" onKeyDown={e => { if (e.key === 'Enter') setSort(c, e.target.value); }} />
              <button className="admin-act" onClick={() => rename(c)}>改名</button>
              <button className="admin-act danger" onClick={() => del(c)}>删除</button>
            </span>
          </div>
          <table className="admin-table">
            <tbody>
              {(c.children || []).map(s => (
                <tr key={s.id}>
                  <td>{s.name}</td>
                  <td className="mono">{s.count} 文档</td>
                  <td style={{ textAlign: 'right' }}>
                    <input className="cat-sort" defaultValue={s.sort} title="排序(回车保存)" onKeyDown={e => { if (e.key === 'Enter') setSort(s, e.target.value); }} />
                    <button className="admin-act" style={{ marginLeft: 6 }} onClick={() => rename(s)}>改名</button>
                    <button className="admin-act danger" style={{ marginLeft: 6 }} onClick={() => del(s)}>删除</button>
                  </td>
                </tr>
              ))}
              <tr>
                <td colSpan="3">
                  <input value={subName[c.id] || ''} onChange={e => setSubName(m => ({ ...m, [c.id]: e.target.value }))}
                    placeholder={'新子分类(归入 ' + c.name + ')'} maxLength={60}
                    onKeyDown={e => { if (e.key === 'Enter') { create(subName[c.id] || '', c.id); setSubName(m => ({ ...m, [c.id]: '' })); } }} />
                  <button className="admin-act" style={{ marginLeft: 8 }} onClick={() => { create(subName[c.id] || '', c.id); setSubName(m => ({ ...m, [c.id]: '' })); }}>+ 子分类</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      ))}
    </div>
  );
}

function ContentAdmin() {
  const [kind, setKind] = useState('work');
  const [list, setList] = useState(null);
  const [editing, setEditing] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  const load = k => api('/api/content/' + k).then(d => setList(d.items)).catch(e => setErr(e.message));
  useEffect(() => { setList(null); setEditing(null); setErr(''); load(kind); }, [kind]);

  const blank = () => ({ title: '', summary: '', cat: (KIND_CATS[kind][0] || [''])[0], icon: '', badge: '', tags: '', author: '', date: '', extra: '', link: '', sort: 0 });
  const set = (k, v) => setEditing(e => ({ ...e, [k]: v }));
  const ph = KIND_PH[kind];

  const save = async () => {
    if (!editing.title.trim()) { setErr('标题不能为空'); return; }
    setBusy(true); setErr('');
    try {
      const body = { ...editing, sort: parseInt(editing.sort, 10) || 0 };
      if (editing.id) await api('/api/content/' + kind + '/' + editing.id, { method: 'PUT', body });
      else await api('/api/content/' + kind, { method: 'POST', body });
      setEditing(null); load(kind);
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };
  const del = async it => {
    if (!window.confirm('删除「' + it.title + '」?此操作不可恢复。')) return;
    try { await api('/api/content/' + kind + '/' + it.id, { method: 'DELETE' }); load(kind); }
    catch (e) { setErr(e.message); }
  };

  return (
    <div>
      <div className="admin-tabs" style={{ marginBottom: 22 }}>
        {KIND_TABS.map(([k, label]) => (
          <button key={k} className={kind === k ? 'on' : ''} onClick={() => setKind(k)}>{label}</button>
        ))}
        <button onClick={() => { setErr(''); setEditing(blank()); }} style={{ marginLeft: 'auto' }}>+ 新增{(KIND_TABS.find(t => t[0] === kind) || [])[1]}</button>
      </div>
      {err && <div className="demo-banner" style={{ borderColor: '#d05858', color: '#d05858' }}>ERROR · {err}</div>}

      {editing && (
        <div className="composer">
          <div className="field"><input value={editing.title} onChange={e => set('title', e.target.value)} placeholder="标题(必填)" maxLength={120} /></div>
          {KIND_CATS[kind].length > 0 && (
            <div className="field">
              <span className="f-pre">分类</span>
              <select value={editing.cat} onChange={e => set('cat', e.target.value)}>
                {KIND_CATS[kind].map(([v, label]) => <option key={v} value={v}>{label}</option>)}
              </select>
            </div>
          )}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(220px,1fr))', gap: 10 }}>
            <div className="field"><input value={editing.icon} onChange={e => set('icon', e.target.value)} placeholder="图标 emoji,如 🎬" /></div>
            <div className="field"><input value={editing.badge} onChange={e => set('badge', e.target.value)} placeholder={ph.badge} /></div>
            <div className="field"><input value={editing.tags} onChange={e => set('tags', e.target.value)} placeholder={ph.tags} /></div>
            <div className="field"><input value={editing.author} onChange={e => set('author', e.target.value)} placeholder={ph.author} /></div>
            <div className="field"><input value={editing.date} onChange={e => set('date', e.target.value)} placeholder={ph.date} /></div>
            <div className="field"><input value={editing.extra} onChange={e => set('extra', e.target.value)} placeholder={ph.extra} /></div>
            <div className="field"><input value={editing.link} onChange={e => set('link', e.target.value)} placeholder="跳转链接(可选,https://…)" /></div>
            <div className="field"><input value={editing.sort} onChange={e => set('sort', e.target.value)} placeholder="排序权重,数字大的在前" inputMode="numeric" /></div>
          </div>
          <textarea value={editing.summary} onChange={e => set('summary', e.target.value)} placeholder="简介 / 摘要" />
          <div className="rb-foot">
            <span className="rb-hint">{editing.id ? 'EDIT · 正在编辑 #' + editing.id : 'NEW · 新增内容'}</span>
            <span>
              <button className="admin-act" onClick={() => setEditing(null)}>取消</button>
              <button className="btn btn-primary" style={{ padding: '9px 22px', fontSize: 13 }} onClick={save} disabled={busy}>
                {busy ? '保存中…' : '保存'}
              </button>
            </span>
          </div>
        </div>
      )}

      {list === null ? <div className="demo-banner">LOADING · 正在加载内容…</div> : (
        <div className="admin-wrap">
          <table className="admin-table">
            <thead><tr><th>ID</th><th>标题</th><th>分类</th><th>日期</th><th>排序</th><th>操作</th></tr></thead>
            <tbody>
              {list.map(it => (
                <tr key={it.id}>
                  <td className="mono">{it.id}</td>
                  <td style={{ maxWidth: 360 }}>{it.icon} {it.title}</td>
                  <td className="mono">{it.cat || '—'}</td>
                  <td className="mono">{it.date || '—'}</td>
                  <td className="mono">{it.sort}</td>
                  <td style={{ whiteSpace: 'nowrap' }}>
                    <button className="admin-act" onClick={() => { setErr(''); setEditing({ ...it }); window.scrollTo(0, 0); }}>编辑</button>
                    <button className="admin-act danger" onClick={() => del(it)}>删除</button>
                  </td>
                </tr>
              ))}
              {list.length === 0 && <tr><td colSpan="6" className="mono">暂无内容,点右上「新增」录入第一条。</td></tr>}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

    if (!isAdmin) return;
    setErr('');
    if (tab === 'overview') loadStats();

                        <td className="mono">{fmtTime(t.created)}</td>
                        <td style={{ whiteSpace: 'nowrap' }}>
                          <button className="admin-act" onClick={() => doPin(t)}>{t.pinned ? '取消置顶' : '置顶'}</button>
                          <button className="admin-act danger" onClick={() => doDel(t)}>删除</button>
                        </td>
                      </tr>
                    ))}
                    {threads.length === 0 && <tr><td colSpan="8" className="mono">暂无帖子</td></tr>}
                  </tbody>
                </table>
              </div>
            )
          )}

          {tab === 'users' && (
            users === null ? <div className="demo-banner">LOADING · 正在加载用户…</div> : (
              <div className="admin-wrap">
                <table className="admin-table">
                  <thead><tr><th>ID</th><th>昵称</th><th>邮箱</th><th>角色</th><th>发帖</th><th>回复</th><th>注册时间</th><th>状态</th><th>操作</th></tr></thead>
                  <tbody>
                    {users.map(u => (
                      <tr key={u.id} className={u.banned ? 'banned-row' : ''}>
                        <td className="mono">{u.id}</td>
                        <td>{u.name}</td>
                        <td className="mono">{u.email}</td>
                        <td>
                          {u.id === user.id ? <span className="role-pill">{roleLabel(u.role)}</span> : (
                            <select value={u.role} onChange={e => doRole(u, e.target.value)}>
                              {Object.keys(ROLE_NAMES).map(r => <option key={r} value={r}>{ROLE_NAMES[r]}</option>)}
                            </select>
                          )}
                        </td>
                        <td className="mono">{u.thread_count}</td>
                        <td className="mono">{u.reply_count}</td>
                        <td className="mono">{fmtTime(u.created)}</td>
                        <td className="mono">{u.banned ? '🚫 封禁' : '✓ 正常'}</td>
                        <td>
                          {u.id !== user.id && u.role !== 'official' && (
                            <button className={'admin-act' + (u.banned ? '' : ' danger')} onClick={() => doBan(u)}>
                              {u.banned ? '解封' : '封禁'}
                            </button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )
          )}
        </div>
      </section>
    </React.Fragment>
  );
}

/* ---------- App ---------- */
const PAGES = { '/': Home, '/works': Works, '/projects': Projects, '/knowledge': Knowledge, '/courses': Courses, '/forum': Forum, '/join': Home, '/admin': Admin };

function App() {
  const route = useHashRoute();
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('whale-theme') || 'light'; } catch (e) { return 'light'; }
  });
  const [user, setUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('whale-user') || 'null'); } catch (e) { return null; }
  });
  const [authOpen, setAuthOpen] = useState(false);
  const login = d => {
    setUser(d.user); setAuthOpen(false);
    try {
      localStorage.setItem('whale-user', JSON.stringify(d.user));
      localStorage.setItem('whale-token', d.token);
    } catch (e) {}
  };
  const logout = () => {
    setUser(null);
    try { localStorage.removeItem('whale-user'); localStorage.removeItem('whale-token'); } catch (e) {}
  };
  useEffect(() => {
    let token = null;
    try { token = localStorage.getItem('whale-token'); } catch (e) {}
    if (token) api('/api/auth/me').then(setUser).catch(() => {});
  }, []);
  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('whale-theme', theme); } catch (e) {}
  }, [theme]);
  useEffect(() => { window.scrollTo(0, 0); }, [route]);
  const Page = PAGES[route] || Home;
  return (
    <AuthCtx.Provider value={{ user, openAuth: () => setAuthOpen(true) }}>
      <Nav route={route} theme={theme} onToggleTheme={() => setTheme(t => (t === 'light' ? 'dark' : 'light'))}
        user={user} onAuth={() => setAuthOpen(true)} onLogout={logout} />
      <Page />
      <Footer />
      {authOpen && <AuthModal onClose={() => setAuthOpen(false)} onLogin={login} />}
    </AuthCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
